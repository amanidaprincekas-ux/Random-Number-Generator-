<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Random Number Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <h1>Random Number Generator</h1>

        <p class="description">
            Generate and hear numbers or words at the interval you choose.
        </p>


        <section class="controls">

            <label for="mode">
                Mode
            </label>

            <select id="mode">

                <option value="numbers">
                    Numbers
                </option>

                <option value="words">
                    Words
                </option>

            </select>


            <div id="number-settings">

                <label for="minimum">
                    Minimum number
                </label>

                <input
                    type="number"
                    id="minimum"
                    value="1"
                >


                <label for="maximum">
                    Maximum number
                </label>

                <input
                    type="number"
                    id="maximum"
                    value="100"
                >

            </div>


            <div id="word-settings">

                <label for="word-input">
                    Word or phrase
                </label>

                <input
                    type="text"
                    id="word-input"
                    placeholder="Type something..."
                >

            </div>


            <label for="interval">
                Speak every
            </label>

            <div class="interval-row">

                <input
                    type="number"
                    id="interval"
                    value="3"
                    min="0.1"
                    step="0.1"
                >

                <select id="unit">

                    <option value="seconds">
                        Seconds
                    </option>

                    <option value="minutes">
                        Minutes
                    </option>

                </select>

            </div>


            <div class="buttons">

                <button id="start-button">
                    START
                </button>

                <button id="stop-button">
                    STOP
                </button>

            </div>

        </section>


        <section class="result">

            <p class="result-label">
                CURRENT RESULT
            </p>

            <div id="result">
                —
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
